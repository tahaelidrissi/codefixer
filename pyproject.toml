[project]
name = "codefixer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Taha Ibourk-El-Idrissi", email = "tahaidrissi0525@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.7.6",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
codefixer = "codefixer.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# Without this, pytest scans the whole repo by default: it collides on
# same-named test files between examples/ and evals/tasks/ (no __init__.py
# to disambiguate them), and picks up evals/tasks/*/hidden_test.py by
# accident, since "*_test.py" matches its default discovery pattern too -
# exactly what a hidden test must never be.
testpaths = ["tests"]
