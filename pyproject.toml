[project]
name = "codefixer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Taha Ibourk-El-Idrissi", email = "tahaidrissi0525@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.7.6",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.20",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
codefixer = "codefixer:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
